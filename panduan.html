<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12252f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"><link rel="icon" href="assets/icon-192.png"><script src="js/theme.js"></script><link rel="stylesheet" href="css/style.css"><title>Panduan · ATHENA</title></head><body data-page="panduan"><main><h1 id="h"></h1><div id="c"></div></main>
<dialog id="zm" class="zm"><button class="btn" id="zx">Tutup</button><img id="zi" alt=""></dialog>
<script src="js/layout.js"></script><script src="js/vendor/marked.umd.js"></script><script>
const $=i=>document.getElementById(i),Q=new URLSearchParams(location.search).get('p'),esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
fetch('panduan/index.json').then(r=>r.json()).then(async L=>{const it=L.find(x=>x.id==Q);
if(!it){$('h').textContent='Panduan';$('c').innerHTML='<div class="menu">'+L.map(x=>'<a href="?p='+x.id+'"><span><b>'+esc(x.judul)+'</b><small>'+esc(x.desk||'')+'</small></span></a>').join('')+'</div>';return}
$('h').innerHTML='<a class="mu" href="panduan.html">‹ Panduan</a><br>'+esc(it.judul);document.title=it.judul+' · ATHENA';
let t=await fetch('panduan/'+it.file).then(r=>r.text()),u='';t=t.replace(/^---\s*\n([\s\S]*?)\n---\s*\n/,(m,y)=>{u=(y.match(/diperbarui:\s*(.+)/)||[])[1]||'';return''});
$('c').innerHTML=(u?'<p class="mu">Diperbarui: '+esc(u)+'</p>':'')+'<div class="md">'+marked.parse(t,{breaks:true}).replace(/<table>/g,'<div class="sc"><table>').replace(/<\/table>/g,'</table></div>')+'</div>';
$('c').querySelectorAll('img').forEach(i=>{const s=i.getAttribute('src');if(!/^(https?:|\/|data:)/.test(s))i.src='panduan/'+s;i.onclick=()=>{$('zi').src=i.src;$('zi').className='';$('zm').showModal()}})});
$('zi').onclick=e=>e.target.classList.toggle('z');$('zx').onclick=()=>$('zm').close();
</script></body></html>
